groups:
  - name: ibl-command-center
    rules:
      - alert: IblApiUnavailable
        expr: up{job="ibl-api"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: IBL API metrics endpoint is unavailable
      - alert: IblDatabaseUnavailable
        expr: ibl_database_up == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: IBL API cannot reach PostgreSQL with its runtime identity
      - alert: IblApiMemoryHigh
        expr: ibl_process_resident_memory_bytes > 1073741824
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: IBL API resident memory has exceeded 1 GiB
